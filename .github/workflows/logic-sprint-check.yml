name: Logic Sprint checks

on:
  push:
    branches:
      - feature/logic-sprint-practice
  pull_request:
    branches:
      - main

jobs:
  syntax-and-data-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check practice-lab.js
          node --check tests/logic-sprint.test.mjs
      - name: Test Logic Sprint integration and question data
        run: node --test tests/logic-sprint.test.mjs
