name: Logic Sprint checks

on:
  push:
    branches:
      - feature/logic-sprint-practice
  pull_request:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check practice module syntax
        run: node --check practice-lab.js
