name: AgentReach notebook validation

on:
  push:
    branches:
      - feature/agentreach-needle3-prototype
    paths:
      - "agentreach/*.ipynb"
      - "agentreach/validate_notebooks.py"
      - ".github/workflows/agentreach-notebook-validation.yml"
  pull_request:
    paths:
      - "agentreach/*.ipynb"
      - "agentreach/validate_notebooks.py"
      - ".github/workflows/agentreach-notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook JSON and safety guards
        run: python agentreach/validate_notebooks.py
